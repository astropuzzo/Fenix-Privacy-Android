name: Build Firefox Desktop extension

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - '.github/workflows/desktop-extension.yml'

permissions:
  contents: write

concurrency:
  group: fenix-privacy-desktop
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Stamp monotonic desktop version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="1.0.${GITHUB_RUN_NUMBER}"
          node - "$VERSION" <<'NODE'
          const fs = require('fs');
          const file = 'desktop/firefox-extension/manifest.json';
          const manifest = JSON.parse(fs.readFileSync(file, 'utf8'));
          manifest.version = process.argv[2];
          fs.writeFileSync(file, JSON.stringify(manifest, null, 2) + '\n');
          NODE
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=desktop-v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install Mozilla web-ext
        run: npm install --global web-ext@10

      - name: Run matcher tests
        run: node desktop/tests/matcher.test.cjs

      - name: Lint extension
        run: web-ext lint --source-dir desktop/firefox-extension

      - name: Build unsigned XPI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          web-ext build \
            --source-dir desktop/firefox-extension \
            --artifacts-dir artifacts \
            --overwrite-dest
          XPI="$(find artifacts -maxdepth 1 -type f -name '*.zip' -print -quit)"
          test -n "$XPI"
          cp "$XPI" artifacts/Fenix-Privacy-Desktop-unsigned.xpi

      - name: Sign XPI with Mozilla AMO
        id: sign
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_API_KEY }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_API_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${WEB_EXT_API_KEY:-}" || -z "${WEB_EXT_API_SECRET:-}" ]]; then
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "AMO secrets are not configured; producing unsigned test artifact only."
            exit 0
          fi
          mkdir -p signed
          web-ext sign \
            --source-dir desktop/firefox-extension \
            --artifacts-dir signed \
            --channel unlisted \
            --api-key "$WEB_EXT_API_KEY" \
            --api-secret "$WEB_EXT_API_SECRET"
          SIGNED="$(find signed -maxdepth 1 -type f -name '*.xpi' -print -quit)"
          test -n "$SIGNED"
          cp "$SIGNED" artifacts/Fenix-Privacy-Desktop-Windows.xpi
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: Fenix-Privacy-Desktop-${{ steps.version.outputs.version }}
          path: artifacts/*.xpi

      - name: Publish signed desktop release
        if: steps.sign.outputs.signed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "${{ steps.version.outputs.tag }}" \
            artifacts/Fenix-Privacy-Desktop-Windows.xpi \
            --title "Fenix Privacy Desktop ${{ steps.version.outputs.version }}" \
            --notes "Mozilla-signed Firefox Desktop extension for Windows. Selective domain/keyword/phrase/regex history suppression; opt-in rule sync between Firefox Desktop profiles through Firefox storage.sync."

      - name: Publish Firefox self-update manifest
        if: steps.sign.outputs.signed == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          SHA256="$(sha256sum artifacts/Fenix-Privacy-Desktop-Windows.xpi | awk '{print $1}')"
          UPDATE_LINK="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/Fenix-Privacy-Desktop-Windows.xpi"
          export SHA256 UPDATE_LINK
          # Remove the temporary version stamp and fast-forward before creating the tracked feed.
          git checkout -- desktop/firefox-extension/manifest.json
          git fetch origin main
          git rebase origin/main
          python3 - <<'PY'
          import json, os
          data = {
              "addons": {
                  "fenix-privacy-desktop@astropuzzo.github.io": {
                      "updates": [{
                          "version": os.environ["VERSION"],
                          "update_link": os.environ["UPDATE_LINK"],
                          "update_hash": "sha256:" + os.environ["SHA256"],
                          "applications": {"gecko": {"strict_min_version": "140.0"}},
                      }]
                  }
              }
          }
          with open("desktop-updates.json", "w", encoding="utf-8") as f:
              json.dump(data, f, indent=2)
              f.write("\n")
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add desktop-updates.json
          git diff --cached --quiet || git commit -m "chore: update desktop add-on feed [skip ci]"
          git push
