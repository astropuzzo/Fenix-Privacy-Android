name: Build Desktop XPI and Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - '.github/workflows/desktop-extension.yml'
  pull_request:
    branches: [main]
    paths:
      - 'desktop/**'
      - '.github/workflows/desktop-extension.yml'

permissions:
  contents: write

concurrency:
  group: fenix-privacy-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  extension:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      release_tag: ${{ steps.version.outputs.release_tag }}
      signed: ${{ steps.sign.outputs.signed }}
      sign_status: ${{ steps.sign.outputs.status }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Stamp monotonic desktop version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="1.0.${GITHUB_RUN_NUMBER}"
          node - "$VERSION" <<'NODE'
          const fs = require('fs');
          const file = 'desktop/firefox-extension/manifest.json';
          const manifest = JSON.parse(fs.readFileSync(file, 'utf8'));
          manifest.version = process.argv[2];
          fs.writeFileSync(file, JSON.stringify(manifest, null, 2) + '\n');
          NODE
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "release_tag=desktop-v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install Mozilla web-ext
        run: npm install --global web-ext@10

      - name: Run desktop tests
        run: node desktop/tests/matcher.test.cjs

      - name: Lint self-hosted extension
        run: web-ext lint --self-hosted --source-dir desktop/firefox-extension

      - name: Build unsigned XPI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          web-ext build \
            --source-dir desktop/firefox-extension \
            --artifacts-dir artifacts \
            --overwrite-dest
          BUILT="$(find artifacts -maxdepth 1 -type f -name '*.zip' -print -quit)"
          test -n "$BUILT"
          mv "$BUILT" artifacts/Fenix-Privacy-Desktop-unsigned.xpi

      - name: Sign XPI with Mozilla AMO
        if: github.event_name != 'pull_request'
        id: sign
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_API_KEY }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_API_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          echo "signed=false" >> "$GITHUB_OUTPUT"
          echo "status=missing" >> "$GITHUB_OUTPUT"

          API_KEY="$(printf '%s' "${WEB_EXT_API_KEY:-}" | tr -d '\r\n')"
          API_SECRET="$(printf '%s' "${WEB_EXT_API_SECRET:-}" | tr -d '\r\n')"

          if [[ -z "$API_KEY" || -z "$API_SECRET" ]]; then
            echo "::warning::AMO repository secrets are missing or empty. Building the unsigned DEV package."
            exit 0
          fi

          echo "AMO credentials detected. Requesting an unlisted Mozilla signature."
          mkdir -p signed
          set +e
          web-ext sign \
            --source-dir desktop/firefox-extension \
            --artifacts-dir signed \
            --channel unlisted \
            --api-key "$API_KEY" \
            --api-secret "$API_SECRET" 2>&1 | tee "$RUNNER_TEMP/web-ext-sign.log"
          status=${PIPESTATUS[0]}
          set -e

          if ((status != 0)); then
            echo "status=failed" >> "$GITHUB_OUTPUT"
            echo "::error::Mozilla AMO signing failed. The repository secrets were present; see the web-ext error above for the actual AMO/API failure."
            exit "$status"
          fi

          SIGNED="$(find signed -maxdepth 1 -type f -name '*.xpi' -print -quit)"
          test -n "$SIGNED" || {
            echo "status=failed" >> "$GITHUB_OUTPUT"
            echo "::error::web-ext reported success but no signed XPI was produced."
            exit 1
          }

          cp "$SIGNED" artifacts/Fenix-Privacy-Desktop-Windows.xpi
          echo "signed=true" >> "$GITHUB_OUTPUT"
          echo "status=signed" >> "$GITHUB_OUTPUT"

      - name: Upload XPI handoff
        uses: actions/upload-artifact@v4
        with:
          name: desktop-xpi-${{ steps.version.outputs.version }}
          retention-days: 7
          if-no-files-found: error
          path: artifacts/*.xpi

  windows-installer:
    needs: extension
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download XPI
        uses: actions/download-artifact@v4
        with:
          name: desktop-xpi-${{ needs.extension.outputs.version }}
          path: artifacts

      - name: Select XPI for installer
        id: package
        shell: pwsh
        run: |
          $signed = "${{ needs.extension.outputs.signed }}" -eq "true"
          if ($signed) {
            $xpi = Resolve-Path "artifacts/Fenix-Privacy-Desktop-Windows.xpi"
            "output=Fenix-Privacy-Desktop-Installer" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          } else {
            $xpi = Resolve-Path "artifacts/Fenix-Privacy-Desktop-unsigned.xpi"
            "output=Fenix-Privacy-Desktop-DEV-Installer" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          }
          "xpi=$($xpi.Path)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build Windows installer EXE
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            $iscc = "${env:ProgramFiles}\Inno Setup 6\ISCC.exe"
          }
          if (-not (Test-Path $iscc)) {
            throw "ISCC.exe not found after installing Inno Setup"
          }

          New-Item -ItemType Directory -Force -Path out | Out-Null
          & $iscc `
            "/DMyAppVersion=${{ needs.extension.outputs.version }}" `
            "/DXpiSource=${{ steps.package.outputs.xpi }}" `
            "/DOutputBase=${{ steps.package.outputs.output }}" `
            "desktop/windows/FenixPrivacyInstaller.iss"

          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup failed with exit code $LASTEXITCODE"
          }

          Get-ChildItem "out\*.exe"

      - name: Assemble desktop artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path final | Out-Null
          Copy-Item artifacts\*.xpi final\
          Copy-Item out\*.exe final\

      - name: Upload Windows desktop artifact
        uses: actions/upload-artifact@v4
        with:
          name: Fenix-Privacy-Desktop-${{ needs.extension.outputs.version }}
          retention-days: 30
          if-no-files-found: error
          path: final/*

  publish:
    if: github.event_name != 'pull_request'
    needs: [extension, windows-installer]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download final desktop artifact
        uses: actions/download-artifact@v4
        with:
          name: Fenix-Privacy-Desktop-${{ needs.extension.outputs.version }}
          path: final

      - name: Publish desktop GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.extension.outputs.version }}
          SIGNED: ${{ needs.extension.outputs.signed }}
          SIGN_STATUS: ${{ needs.extension.outputs.sign_status }}
          RELEASE_TAG: ${{ needs.extension.outputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$SIGNED" == "true" ]]; then
            gh release create "$RELEASE_TAG" \
              final/Fenix-Privacy-Desktop-Windows.xpi \
              final/Fenix-Privacy-Desktop-Installer.exe \
              --title "Fenix Privacy Desktop $VERSION" \
              --notes "Mozilla-signed Firefox extension plus Windows installer EXE. The EXE launches the signed XPI in Firefox for the normal add-on confirmation."
          else
            DEV_TAG="desktop-dev-v$VERSION"
            gh release create "$DEV_TAG" \
              final/Fenix-Privacy-Desktop-unsigned.xpi \
              final/Fenix-Privacy-Desktop-DEV-Installer.exe \
              --prerelease \
              --title "Fenix Privacy Desktop DEV $VERSION" \
              --notes "Automatic development build. Mozilla signing was skipped because the AMO repository secrets were missing or empty (status: ${SIGN_STATUS:-missing}). Firefox Release will not permanently install the unsigned add-on."
          fi

      - name: Publish Firefox self-update manifest
        if: needs.extension.outputs.signed == 'true'
        env:
          VERSION: ${{ needs.extension.outputs.version }}
          RELEASE_TAG: ${{ needs.extension.outputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail

          SHA256="$(sha256sum final/Fenix-Privacy-Desktop-Windows.xpi | awk '{print $1}')"
          UPDATE_LINK="https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/Fenix-Privacy-Desktop-Windows.xpi"
          export SHA256 UPDATE_LINK

          git fetch origin main
          git checkout main
          git reset --hard origin/main

          python3 - <<'PY'
          import json, os
          data = {
              "addons": {
                  "fenix-privacy-desktop@astropuzzo.github.io": {
                      "updates": [{
                          "version": os.environ["VERSION"],
                          "update_link": os.environ["UPDATE_LINK"],
                          "update_hash": "sha256:" + os.environ["SHA256"],
                          "applications": {
                              "gecko": {"strict_min_version": "142.0"}
                          },
                      }]
                  }
              }
          }
          with open("desktop-updates.json", "w", encoding="utf-8") as f:
              json.dump(data, f, indent=2)
              f.write("\n")
          PY

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add desktop-updates.json
          git diff --cached --quiet || git commit -m "chore: update desktop add-on feed [skip ci]"
          git push origin main
