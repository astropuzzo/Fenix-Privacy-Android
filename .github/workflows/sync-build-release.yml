name: Sync Firefox, build and release

on:
  workflow_dispatch:
    inputs:
      force:
        description: Build even if the stable Firefox tag did not change
        required: false
        default: true
        type: boolean
  schedule:
    - cron: '23 4 * * *'
permissions:
  contents: write

concurrency:
  group: fenix-privacy-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      MOZBUILD_STATE_PATH: ${{ github.workspace }}/.mozbuild
    steps:
      - uses: actions/checkout@v4

      - name: Find latest stable Firefox release
        id: upstream
        shell: bash
        run: |
          set -euo pipefail
          read REF SHA < <(git ls-remote --tags https://github.com/mozilla-firefox/firefox.git 'refs/tags/FIREFOX_*_RELEASE' | python3 scripts/find_latest_stable_ref.py --verify-android-release)
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "tag_sha=$SHA" >> "$GITHUB_OUTPUT"
          CURRENT="$(cat UPSTREAM_REF 2>/dev/null || true)"
          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "Latest stable upstream: $REF"

      - name: Decide whether to build
        id: decision
        shell: bash
        run: |
          FORCE="${{ github.event_name != 'schedule' || inputs.force == true }}"
          if [[ "${{ steps.upstream.outputs.ref }}" == "${{ steps.upstream.outputs.current }}" && "$FORCE" != "true" ]]; then
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "No new stable Firefox release."
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate signing secrets
        if: steps.decision.outputs.build == 'true'
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          STORE_PASS: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE" && test -n "$ALIAS" && test -n "$STORE_PASS" && test -n "$KEY_PASS" || {
            echo "Missing Android signing secrets. See docs/SIGNING.md" >&2
            exit 1
          }

      - name: Fetch upstream Firefox
        if: steps.decision.outputs.build == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git init upstream
          git -C upstream remote add origin https://github.com/mozilla-firefox/firefox.git
          git -C upstream fetch --depth=1 origin "refs/tags/${{ steps.upstream.outputs.ref }}:refs/tags/${{ steps.upstream.outputs.ref }}"
          git -C upstream checkout --detach "${{ steps.upstream.outputs.ref }}"
          REV="$(git -C upstream rev-parse HEAD)"
          echo "FENIX_PRIVACY_UPSTREAM_REVISION=$REV" >> "$GITHUB_ENV"
          echo "FENIX_PRIVACY_UPSTREAM_REF=${{ steps.upstream.outputs.ref }}" >> "$GITHUB_ENV"

      - name: Apply Fenix Privacy patch
        if: steps.decision.outputs.build == 'true'
        run: python3 scripts/apply_fenix_privacy.py upstream

      - name: Prepare version
        if: steps.decision.outputs.build == 'true'
        shell: bash
        run: |
          set -euo pipefail
          RAW="${{ steps.upstream.outputs.ref }}"
          FIREFOX_VERSION="$(python3 - <<'PY'
          import os, re
          s=os.environ['RAW']
          m=re.fullmatch(r'FIREFOX_(\d+)_(\d+)(?:_(\d+))?_RELEASE', s)
          if not m: raise SystemExit('bad Firefox release ref')
          parts = [str(int(m.group(1))), str(int(m.group(2)))]
          if m.group(3) is not None:
              parts.append(str(int(m.group(3))))
          print('.'.join(parts))
          PY
          )"
          CODE="$(( $(date -u +%s) - 1735689600 ))"
          NAME="${FIREFOX_VERSION}-privacy.$(date -u +%Y%m%d%H%M%S)"
          echo "FENIX_PRIVACY_VERSION_CODE=$CODE" >> "$GITHUB_ENV"
          echo "FENIX_PRIVACY_VERSION_NAME=$NAME" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=v$NAME" >> "$GITHUB_ENV"
        env:
          RAW: ${{ steps.upstream.outputs.ref }}

      - name: Bootstrap Firefox Android artifact build
        if: steps.decision.outputs.build == 'true'
        working-directory: upstream
        run: ./mach --no-interactive bootstrap --application-choice="GeckoView/Firefox for Android Artifact Mode"

      - name: Build unsigned universal release APK
        if: steps.decision.outputs.build == 'true'
        working-directory: upstream
        run: ./mach gradle fenix:assembleRelease -PdisableDebugSigning

      - name: Sign APK
        if: steps.decision.outputs.build == 'true'
        id: sign
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          APK="$(find upstream -type f -path '*/mobile/android/fenix/app/outputs/apk/release/*' -name '*universal*.apk' -print -quit)"
          if [[ -z "$APK" ]]; then
            APK="$(find upstream -type f -path '*/fenix/app/outputs/apk/release/*' -name '*universal*.apk' -print -quit)"
          fi
          test -n "$APK" || { echo "Universal APK not found" >&2; find upstream -type f -name '*.apk' -print >&2; exit 1; }
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > /tmp/fenix-privacy-release.jks
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [[ -z "$SDK_ROOT" || ! -d "$SDK_ROOT/build-tools" ]]; then
            SDK_ROOT="$(find "$MOZBUILD_STATE_PATH" -mindepth 1 -maxdepth 1 -type d -name 'android-sdk-*' -print -quit)"
          fi
          test -n "$SDK_ROOT" && test -d "$SDK_ROOT/build-tools" || { echo "Android SDK build-tools not found" >&2; exit 1; }
          BUILD_TOOLS="$(find "$SDK_ROOT/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n1)"
          "$BUILD_TOOLS/zipalign" -p -f 4 "$APK" /tmp/Fenix-Privacy-aligned.apk
          "$BUILD_TOOLS/apksigner" sign \
            --ks /tmp/fenix-privacy-release.jks \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass "pass:$ANDROID_STORE_PASSWORD" \
            --key-pass "pass:$ANDROID_KEY_PASSWORD" \
            --out Fenix-Privacy-universal.apk \
            /tmp/Fenix-Privacy-aligned.apk
          VERIFY_OUTPUT="$("$BUILD_TOOLS/apksigner" verify --verbose --print-certs Fenix-Privacy-universal.apk)"
          printf '%s\n' "$VERIFY_OUTPUT"
          ACTUAL_CERT="$(printf '%s\n' "$VERIFY_OUTPUT" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n1 | tr '[:upper:]' '[:lower:]' | tr -d ':')"
          EXPECTED_CERT="$(tr '[:upper:]' '[:lower:]' < SIGNING_CERT_SHA256 | tr -d '[:space:]:')"
          test -n "$ACTUAL_CERT" && [[ "$ACTUAL_CERT" == "$EXPECTED_CERT" ]] || {
            echo "Signing certificate mismatch" >&2
            exit 1
          }
          rm -f /tmp/fenix-privacy-release.jks /tmp/Fenix-Privacy-aligned.apk

      - name: Create signed update manifest
        if: steps.decision.outputs.build == 'true'
        shell: bash
        run: |
          set -euo pipefail
          export FENIX_PRIVACY_APK_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/Fenix-Privacy-universal.apk"
          python3 scripts/make_update_json.py Fenix-Privacy-universal.apk update.json
          cat update.json

      - uses: actions/upload-artifact@v4
        if: steps.decision.outputs.build == 'true'
        with:
          name: Fenix-Privacy-${{ env.FENIX_PRIVACY_VERSION_NAME }}
          path: |
            Fenix-Privacy-universal.apk
            update.json

      - name: Publish GitHub release
        if: steps.decision.outputs.build == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" \
            Fenix-Privacy-universal.apk update.json \
            --title "Fenix Privacy $FENIX_PRIVACY_VERSION_NAME" \
            --notes "Built from Mozilla Firefox ${FENIX_PRIVACY_UPSTREAM_REF} (${FENIX_PRIVACY_UPSTREAM_REVISION}). Native domain/keyword/regex history suppression, Firefox Sync support, signed in-app update feed."

      - name: Record successfully released upstream
        if: steps.decision.outputs.build == 'true'
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' "$FENIX_PRIVACY_UPSTREAM_REF" > UPSTREAM_REF
          printf '%s\n' "$FENIX_PRIVACY_UPSTREAM_REVISION" > UPSTREAM_REVISION
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add UPSTREAM_REF UPSTREAM_REVISION
          git diff --cached --quiet || git commit -m "chore: track $FENIX_PRIVACY_UPSTREAM_REF"
          git push
