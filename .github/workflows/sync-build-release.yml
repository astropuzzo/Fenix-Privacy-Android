name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      force:
        description: Build even if the stable Firefox tag did not change
        required: false
        default: true
        type: boolean
  push:
    branches: [main]
    paths-ignore:
      - 'UPSTREAM_REF'
      - 'UPSTREAM_REVISION'
      - 'desktop/**'
      - 'desktop-updates.json'
      - '.github/workflows/desktop-extension.yml'
      - '**/*.md'
  pull_request:
    branches: [main]
    paths:
      - 'overlay/**'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/sync-build-release.yml'
      - 'SIGNING_CERT_SHA256'
  schedule:
    - cron: '23 4 * * *'

permissions:
  contents: write

concurrency:
  group: fenix-privacy-android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      MOZBUILD_STATE_PATH: ${{ github.workspace }}/.mozbuild

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Run patch and release tooling tests
        run: python3 -m unittest discover -s tests -v

      - name: Find latest stable Firefox release
        id: upstream
        shell: bash
        run: |
          set -euo pipefail
          lookup=''
          for attempt in 1 2 3; do
            set +e
            lookup="$(
              git ls-remote --tags https://github.com/mozilla-firefox/firefox.git 'refs/tags/FIREFOX_*_RELEASE' |
                python3 scripts/find_latest_stable_ref.py --verify-android-release
            )"
            status=$?
            set -e

            if ((status == 0)) && [[ -n "$lookup" ]]; then
              break
            fi
            if ((attempt == 3)); then
              echo "Stable Firefox lookup failed after 3 attempts." >&2
              exit "${status:-1}"
            fi
            delay=$((15 * attempt))
            echo "Stable Firefox lookup failed; retrying in ${delay}s." >&2
            sleep "$delay"
          done
          read -r REF SHA <<< "$lookup"
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "tag_sha=$SHA" >> "$GITHUB_OUTPUT"
          CURRENT="$(cat UPSTREAM_REF 2>/dev/null || true)"
          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "Latest stable upstream: $REF"

      - name: Decide whether to build
        id: decision
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_FORCE: ${{ inputs.force }}
          REF: ${{ steps.upstream.outputs.ref }}
          CURRENT: ${{ steps.upstream.outputs.current }}
        run: |
          set -euo pipefail
          FORCE=false

          if [[ "$EVENT_NAME" == "push" || "$EVENT_NAME" == "pull_request" ]]; then
            FORCE=true
          fi

          if [[ "$EVENT_NAME" == "workflow_dispatch" && "${INPUT_FORCE:-false}" == "true" ]]; then
            FORCE=true
          fi

          if [[ "$REF" == "$CURRENT" && "$FORCE" != "true" ]]; then
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "No new stable Firefox release."
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "Building Android APK (event=$EVENT_NAME, force=$FORCE)."
          fi

      - name: Validate Android signing key, passwords and certificate
        if: steps.decision.outputs.build == 'true' && github.event_name != 'pull_request'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail

          missing=()
          [[ -n "${ANDROID_KEYSTORE_BASE64:-}" ]] || missing+=(ANDROID_KEYSTORE_BASE64)
          [[ -n "${ANDROID_KEY_ALIAS:-}" ]] || missing+=(ANDROID_KEY_ALIAS)
          [[ -n "${ANDROID_STORE_PASSWORD:-}" ]] || missing+=(ANDROID_STORE_PASSWORD)
          [[ -n "${ANDROID_KEY_PASSWORD:-}" ]] || missing+=(ANDROID_KEY_PASSWORD)
          if (("${#missing[@]}" > 0)); then
            echo "::error::Missing Android Actions secrets: ${missing[*]}. See docs/SIGNING.md."
            exit 1
          fi

          KEYSTORE_PATH="$RUNNER_TEMP/fenix-privacy-preflight.jks"
          PREFLIGHT_DIR="$RUNNER_TEMP/fenix-privacy-signing-preflight"
          trap 'rm -rf "$KEYSTORE_PATH" "$PREFLIGHT_DIR"' EXIT

          printf '%s' "$ANDROID_KEYSTORE_BASE64" |
            tr -d '[:space:]' |
            base64 --decode > "$KEYSTORE_PATH"
          [[ -s "$KEYSTORE_PATH" ]] || {
            echo "::error::ANDROID_KEYSTORE_BASE64 did not decode to a non-empty JKS."
            exit 1
          }

          KEY_ALIAS="$(printf '%s' "$ANDROID_KEY_ALIAS" | tr -d '\r\n')"
          [[ -n "$KEY_ALIAS" ]] || {
            echo "::error::ANDROID_KEY_ALIAS is empty after removing line breaks."
            exit 1
          }

          keytool -list -v \
            -keystore "$KEYSTORE_PATH" \
            -storepass "$ANDROID_STORE_PASSWORD" \
            -alias "$KEY_ALIAS" >/dev/null

          ACTUAL_CERT="$(
            keytool -exportcert -rfc \
              -keystore "$KEYSTORE_PATH" \
              -storepass "$ANDROID_STORE_PASSWORD" \
              -alias "$KEY_ALIAS" |
              openssl x509 -noout -fingerprint -sha256 |
              sed 's/.*=//' | tr '[:upper:]' '[:lower:]' | tr -d ':'
          )"
          EXPECTED_CERT="$(tr '[:upper:]' '[:lower:]' < SIGNING_CERT_SHA256 | tr -d '[:space:]:')"
          [[ -n "$ACTUAL_CERT" && "$ACTUAL_CERT" == "$EXPECTED_CERT" ]] || {
            echo "::error::The configured JKS certificate does not match SIGNING_CERT_SHA256."
            exit 1
          }

          mkdir -p "$PREFLIGHT_DIR"
          printf 'Fenix Privacy signing preflight\n' > "$PREFLIGHT_DIR/payload.txt"
          (
            cd "$PREFLIGHT_DIR"
            jar --create --file unsigned.jar payload.txt
            jarsigner \
              -keystore "$KEYSTORE_PATH" \
              -storepass "$ANDROID_STORE_PASSWORD" \
              -keypass "$ANDROID_KEY_PASSWORD" \
              -signedjar signed.jar \
              unsigned.jar \
              "$KEY_ALIAS" >/dev/null
            jarsigner -verify signed.jar >/dev/null
          )
          echo "Android production signing material passed alias, password and certificate checks."

      - name: Fetch upstream Firefox
        id: firefox
        if: steps.decision.outputs.build == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git init upstream
          git -C upstream remote add origin https://github.com/mozilla-firefox/firefox.git
          git -C upstream fetch --depth=1 origin \
            "refs/tags/${{ steps.upstream.outputs.ref }}:refs/tags/${{ steps.upstream.outputs.ref }}"
          git -C upstream checkout --detach "${{ steps.upstream.outputs.ref }}"
          REV="$(git -C upstream rev-parse HEAD)"
          echo "revision=$REV" >> "$GITHUB_OUTPUT"
          echo "FENIX_PRIVACY_UPSTREAM_REVISION=$REV" >> "$GITHUB_ENV"
          echo "FENIX_PRIVACY_UPSTREAM_REF=${{ steps.upstream.outputs.ref }}" >> "$GITHUB_ENV"

      - name: Apply Fenix Privacy patch
        if: steps.decision.outputs.build == 'true'
        run: python3 scripts/apply_fenix_privacy.py upstream

      - name: Remove AVD-only payload from Mozilla bootstrap
        if: steps.decision.outputs.build == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          bootstrap = Path("upstream/python/mozboot/mozboot/linux_common.py")
          text = bootstrap.read_text(encoding="utf-8")

          avd_manifest = "            avd_manifest_path=android.AVD_MANIFEST_X86_64,\n"
          avd_toolchain = "        self.install_toolchain_artifact(android.X86_64_ANDROID_AVD)\n"

          if text.count(avd_manifest) != 1:
              raise SystemExit("Mozilla Android bootstrap AVD manifest anchor changed")
          if text.count(avd_toolchain) != 1:
              raise SystemExit("Mozilla Android bootstrap AVD toolchain anchor changed")

          text = text.replace(avd_manifest, "            avd_manifest_path=None,\n", 1)
          text = text.replace(
              avd_toolchain,
              "        # CI APK build: AVD/system-image toolchain intentionally omitted.\n",
              1,
          )
          bootstrap.write_text(text, encoding="utf-8")
          PY

          grep -n -A8 -B4 'ensure_mobile_android_packages\|avd_manifest_path' \
            upstream/python/mozboot/mozboot/linux_common.py
          echo 'Android SDK packages retained for configure/build:'
          cat upstream/python/mozboot/mozboot/android-packages.txt

      - name: Prepare version
        if: steps.decision.outputs.build == 'true'
        shell: bash
        env:
          RAW: ${{ steps.upstream.outputs.ref }}
        run: |
          set -euo pipefail
          FIREFOX_VERSION="$(python3 - <<'PY'
          import os, re
          s = os.environ["RAW"]
          m = re.fullmatch(r"FIREFOX_(\d+)_(\d+)(?:_(\d+))?_RELEASE", s)
          if not m:
              raise SystemExit("bad Firefox release ref")
          parts = [str(int(m.group(1))), str(int(m.group(2)))]
          if m.group(3) is not None:
              parts.append(str(int(m.group(3))))
          print(".".join(parts))
          PY
          )"
          CODE="$(( $(date -u +%s) - 1735689600 ))"
          NAME="${FIREFOX_VERSION}-privacy.$(date -u +%Y%m%d%H%M%S)"
          echo "FENIX_PRIVACY_VERSION_CODE=$CODE" >> "$GITHUB_ENV"
          echo "FENIX_PRIVACY_VERSION_NAME=$NAME" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=v$NAME" >> "$GITHUB_ENV"

      - name: Free runner disk for Firefox build
        if: steps.decision.outputs.build == 'true'
        shell: bash
        run: |
          set -euo pipefail
          echo 'Disk before cleanup:'
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/share/swift || true
          sudo apt-get clean
          docker system prune -af || true
          echo 'Disk after cleanup:'
          df -h /

      - name: Restore Gradle dependency cache
        if: steps.decision.outputs.build == 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ steps.firefox.outputs.revision }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Bootstrap Firefox Android artifact build
        if: steps.decision.outputs.build == 'true'
        working-directory: upstream
        run: ./mach --no-interactive bootstrap --application-choice="GeckoView/Firefox for Android Artifact Mode"

      - name: Verify AVD system-image was not installed
        if: steps.decision.outputs.build == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if find "$MOZBUILD_STATE_PATH" -maxdepth 3 \( -iname '*android-avd*' -o -iname '*android-device*' \) | grep -q .; then
            echo "Unexpected Android AVD/system-image payload found:" >&2
            find "$MOZBUILD_STATE_PATH" -maxdepth 3 \( -iname '*android-avd*' -o -iname '*android-device*' \) -print >&2
            exit 1
          fi
          test -d "$MOZBUILD_STATE_PATH/android-sdk-linux/emulator" || {
            echo "Android SDK emulator package required by Mozilla configure is missing" >&2
            exit 1
          }
          df -h /

      - name: Initialize Android artifact build context
        if: steps.decision.outputs.build == 'true'
        working-directory: upstream
        env:
          MOZCONFIG: mozconfig
        run: ./mach build

      - name: Release bootstrap Gradle memory
        if: steps.decision.outputs.build == 'true'
        working-directory: upstream
        env:
          MOZCONFIG: mozconfig
        shell: bash
        run: |
          set -euo pipefail
          # `mach build` uses upstream's 7 GiB Gradle daemon. It remains alive
          # after GeckoView is published and starves the separate Fenix build.
          ./mach gradle --stop || true
          pkill -f '[K]otlinCompileDaemon' || true
          sleep 3
          free -h

      - name: Build unsigned universal release APK
        if: steps.decision.outputs.build == 'true'
        working-directory: upstream
        env:
          MOZCONFIG: mozconfig
          # Keep enough memory for the Actions agent and OS on the 7.8 GiB
          # hosted runner. Kotlin compiles inside this capped Gradle process,
          # avoiding a second multi-gigabyte daemon.
          GRADLE_FLAGS: >-
            --no-daemon
            --no-parallel
            --max-workers=1
            -Pkotlin.compiler.execution.strategy=in-process
            -Dorg.gradle.vfs.watch=false
            "-Dorg.gradle.jvmargs=-Xmx4608m -Xms1g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError -XX:+UseParallelGC"
        shell: bash
        run: |
          set -euo pipefail

          free -h
          df -h /

          max_attempts=4
          for ((attempt = 1; attempt <= max_attempts; attempt++)); do
            log="$RUNNER_TEMP/fenix-gradle-attempt-$attempt.log"
            echo "::group::Fenix Gradle build attempt $attempt of $max_attempts"
            refresh_args=()
            if ((attempt > 1)); then
              refresh_args+=(--refresh-dependencies)
            fi

            set +e
            ./mach gradle "${refresh_args[@]}" fenix:assembleRelease -PdisableDebugSigning 2>&1 | tee "$log"
            status=${PIPESTATUS[0]}
            set -e

            echo "::endgroup::"
            if ((status == 0)); then
              exit 0
            fi

            if ! grep -Eqi 'maven\.mozilla\.org|repo1\.maven\.org|plugins\.gradle\.org' "$log" || \
               ! grep -Eqi 'status code (408|429|5[0-9]{2})|service unavailable|could not (get|head)|connection (reset|refused)|timed? out|temporary failure|remote host terminated' "$log"; then
              echo "Gradle failed for a non-transient reason; not retrying." >&2
              exit "$status"
            fi

            if ((attempt == max_attempts)); then
              echo "Mozilla Maven remained unavailable after $max_attempts attempts." >&2
              exit "$status"
            fi

            delay=$((30 * (1 << (attempt - 1))))
            echo "Transient Mozilla Maven failure detected; retrying in ${delay}s."
            sleep "$delay"
          done

      - name: Upload Gradle failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Fenix-Privacy-Android-Gradle-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: ignore
          path: ${{ runner.temp }}/fenix-gradle-attempt-*.log

      - name: Locate and validate unsigned universal APK
        id: apk
        if: steps.decision.outputs.build == 'true'
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t APKS < <(
            find upstream -type f -path '*/fenix/app/outputs/apk/release/*.apk' -print
          )
          if (("${#APKS[@]}" == 0)); then
            echo "No APK was produced by fenix:assembleRelease" >&2
            find upstream -type f -name '*.apk' -print >&2
            exit 1
          fi

          printf 'Produced release APKs:\n'
          printf '  %s\n' "${APKS[@]}"

          mapfile -t UNIVERSAL_APKS < <(printf '%s\n' "${APKS[@]}" | grep -i 'universal' || true)
          if (("${#UNIVERSAL_APKS[@]}" > 0)); then
            APK="$(ls -S "${UNIVERSAL_APKS[@]}" | head -n1)"
          else
            APK="$(ls -S "${APKS[@]}" | head -n1)"
            echo "::warning::No APK filename contained 'universal'; selecting the largest release APK: $APK"
          fi

          SDK_ROOT="$MOZBUILD_STATE_PATH/android-sdk-linux"
          if [[ ! -d "$SDK_ROOT/build-tools" ]]; then
            SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          fi
          [[ -n "$SDK_ROOT" && -d "$SDK_ROOT/build-tools" ]] || {
            echo "Android SDK build-tools not found" >&2
            exit 1
          }
          BUILD_TOOLS="$(find "$SDK_ROOT/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n1)"
          [[ -x "$BUILD_TOOLS/aapt" ]] || {
            echo "Android aapt not found in $BUILD_TOOLS" >&2
            exit 1
          }

          BADGING="$("$BUILD_TOOLS/aapt" dump badging "$APK")"
          printf '%s\n' "$BADGING" | head -n1
          printf '%s\n' "$BADGING" | grep -F "package: name='io.github.astropuzzo.fenixprivacy'"
          printf '%s\n' "$BADGING" | grep -F "versionCode='$FENIX_PRIVACY_VERSION_CODE'"
          printf '%s\n' "$BADGING" | grep -F "versionName='$FENIX_PRIVACY_VERSION_NAME'"

          echo "path=$APK" >> "$GITHUB_OUTPUT"
          echo "FENIX_PRIVACY_UNSIGNED_APK=$APK" >> "$GITHUB_ENV"

      - name: Upload PR smoke-test APKs
        if: steps.decision.outputs.build == 'true' && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: Fenix-Privacy-Android-PR-smoke-${{ github.event.pull_request.number }}
          retention-days: 7
          if-no-files-found: error
          path: ${{ steps.apk.outputs.path }}

      - name: Upload unsigned release handoff
        if: steps.decision.outputs.build == 'true' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: Fenix-Privacy-Android-unsigned-${{ env.FENIX_PRIVACY_VERSION_NAME }}
          retention-days: 3
          if-no-files-found: error
          path: ${{ steps.apk.outputs.path }}

      - name: Sign and verify APK
        if: steps.decision.outputs.build == 'true' && github.event_name != 'pull_request'
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          APK="${FENIX_PRIVACY_UNSIGNED_APK:-}"
          [[ -n "$APK" && -f "$APK" ]] || {
            echo "Validated unsigned APK path is missing" >&2
            exit 1
          }

          KEY_ALIAS="$(printf '%s' "$ANDROID_KEY_ALIAS" | tr -d '\r\n')"
          [[ -n "$KEY_ALIAS" ]] || {
            echo "Android key alias is empty after removing line breaks" >&2
            exit 1
          }

          KEYSTORE_PATH="$RUNNER_TEMP/fenix-privacy-release.jks"
          ALIGNED_APK="$RUNNER_TEMP/Fenix-Privacy-aligned.apk"
          trap 'rm -f "$KEYSTORE_PATH" "$ALIGNED_APK"' EXIT
          printf '%s' "$ANDROID_KEYSTORE_BASE64" |
            tr -d '[:space:]' |
            base64 --decode > "$KEYSTORE_PATH"

          SDK_ROOT="$MOZBUILD_STATE_PATH/android-sdk-linux"
          if [[ ! -d "$SDK_ROOT/build-tools" ]]; then
            SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          fi
          [[ -n "$SDK_ROOT" && -d "$SDK_ROOT/build-tools" ]] || {
            echo "Android SDK build-tools not found" >&2
            exit 1
          }

          BUILD_TOOLS="$(find "$SDK_ROOT/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n1)"
          rm -f Fenix-Privacy-Android.apk
          "$BUILD_TOOLS/zipalign" -p -f 4 "$APK" "$ALIGNED_APK"
          "$BUILD_TOOLS/zipalign" -c -p -v 4 "$ALIGNED_APK"
          "$BUILD_TOOLS/apksigner" sign \
            --ks "$KEYSTORE_PATH" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$ANDROID_STORE_PASSWORD" \
            --key-pass "pass:$ANDROID_KEY_PASSWORD" \
            --out Fenix-Privacy-Android.apk \
            "$ALIGNED_APK"

          VERIFY_OUTPUT="$("$BUILD_TOOLS/apksigner" verify --verbose --print-certs Fenix-Privacy-Android.apk)"
          printf '%s\n' "$VERIFY_OUTPUT"
          printf '%s\n' "$VERIFY_OUTPUT" | grep -F 'Verified'

          ACTUAL_CERT="$(
            printf '%s\n' "$VERIFY_OUTPUT" |
            awk -F': ' '/certificate SHA-256 digest:/ { print $NF; exit }' |
            tr '[:upper:]' '[:lower:]' | tr -d '[:space:]:'
          )"
          EXPECTED_CERT="$(tr '[:upper:]' '[:lower:]' < SIGNING_CERT_SHA256 | tr -d '[:space:]:')"

          test -n "$ACTUAL_CERT" && [[ "$ACTUAL_CERT" == "$EXPECTED_CERT" ]] || {
            echo "Signing certificate mismatch" >&2
            exit 1
          }

          BADGING="$("$BUILD_TOOLS/aapt" dump badging Fenix-Privacy-Android.apk)"
          printf '%s\n' "$BADGING" | head -n1
          printf '%s\n' "$BADGING" | grep -F "package: name='io.github.astropuzzo.fenixprivacy'"
          printf '%s\n' "$BADGING" | grep -F "versionCode='$FENIX_PRIVACY_VERSION_CODE'"
          printf '%s\n' "$BADGING" | grep -F "versionName='$FENIX_PRIVACY_VERSION_NAME'"
          sha256sum Fenix-Privacy-Android.apk

      - name: Create update manifest
        if: steps.decision.outputs.build == 'true' && github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          export FENIX_PRIVACY_APK_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/Fenix-Privacy-Android.apk"
          python3 scripts/make_update_json.py Fenix-Privacy-Android.apk update.json
          cat update.json

      - name: Upload Android build artifact
        if: steps.decision.outputs.build == 'true' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: Fenix-Privacy-Android-${{ env.FENIX_PRIVACY_VERSION_NAME }}
          retention-days: 30
          if-no-files-found: error
          path: |
            Fenix-Privacy-Android.apk
            update.json

      - name: Publish Android GitHub Release
        if: steps.decision.outputs.build == 'true' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" \
              Fenix-Privacy-Android.apk \
              update.json \
              --clobber
          else
            gh release create "$RELEASE_TAG" \
              Fenix-Privacy-Android.apk \
              update.json \
              --latest \
              --title "Fenix Privacy Android $FENIX_PRIVACY_VERSION_NAME" \
              --notes "Automatically built from Mozilla Firefox ${FENIX_PRIVACY_UPSTREAM_REF} (${FENIX_PRIVACY_UPSTREAM_REVISION}). Production-signed APK; certificate and package identity verified in CI."
          fi

          ASSETS="$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')"
          printf '%s\n' "$ASSETS"
          grep -Fxq 'Fenix-Privacy-Android.apk' <<< "$ASSETS"
          grep -Fxq 'update.json' <<< "$ASSETS"

      - name: Record successfully released upstream
        if: steps.decision.outputs.build == 'true' && github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' "$FENIX_PRIVACY_UPSTREAM_REF" > UPSTREAM_REF
          printf '%s\n' "$FENIX_PRIVACY_UPSTREAM_REVISION" > UPSTREAM_REVISION
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add UPSTREAM_REF UPSTREAM_REVISION
          if git diff --cached --quiet; then
            echo "Upstream release pointer is already current."
            exit 0
          fi
          git commit -m "chore: track $FENIX_PRIVACY_UPSTREAM_REF [skip ci]"

          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              exit 0
            fi
            if ((attempt == 3)); then
              echo "Unable to record released upstream after 3 attempts." >&2
              exit 1
            fi
            sleep "$((attempt * 5))"
          done
