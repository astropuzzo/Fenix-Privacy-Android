name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      force:
        description: Build even if the stable Firefox tag did not change
        required: false
        default: true
        type: boolean
  push:
    branches: [main]
    paths-ignore:
      - 'UPSTREAM_REF'
      - 'UPSTREAM_REVISION'
      - 'desktop/**'
      - 'desktop-updates.json'
      - '.github/workflows/desktop-extension.yml'
      - '**/*.md'
  pull_request:
    branches: [main]
    paths:
      - 'android_overlay/**'
      - 'scripts/**'
      - '.github/workflows/sync-build-release.yml'
      - 'SIGNING_CERT_SHA256'
  schedule:
    - cron: '23 4 * * *'

permissions:
  contents: write

concurrency:
  group: fenix-privacy-android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      MOZBUILD_STATE_PATH: ${{ github.workspace }}/.mozbuild

    steps:
      - uses: actions/checkout@v4

      - name: Find latest stable Firefox release
        id: upstream
        shell: bash
        run: |
          set -euo pipefail
          read REF SHA < <(
            git ls-remote --tags https://github.com/mozilla-firefox/firefox.git 'refs/tags/FIREFOX_*_RELEASE' |
            python3 scripts/find_latest_stable_ref.py --verify-android-release
          )
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "tag_sha=$SHA" >> "$GITHUB_OUTPUT"
          CURRENT="$(cat UPSTREAM_REF 2>/dev/null || true)"
          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "Latest stable upstream: $REF"

      - name: Decide whether to build
        id: decision
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_FORCE: ${{ inputs.force }}
          REF: ${{ steps.upstream.outputs.ref }}
          CURRENT: ${{ steps.upstream.outputs.current }}
        run: |
          set -euo pipefail
          FORCE=false

          if [[ "$EVENT_NAME" == "push" || "$EVENT_NAME" == "pull_request" ]]; then
            FORCE=true
          fi

          if [[ "$EVENT_NAME" == "workflow_dispatch" && "${INPUT_FORCE:-false}" == "true" ]]; then
            FORCE=true
          fi

          if [[ "$REF" == "$CURRENT" && "$FORCE" != "true" ]]; then
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "No new stable Firefox release."
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "Building Android APK (event=$EVENT_NAME, force=$FORCE)."
          fi

      - name: Validate Android signing secrets
        if: steps.decision.outputs.build == 'true' && github.event_name != 'pull_request'
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          STORE_PASS: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KEYSTORE" && test -n "$ALIAS" && test -n "$STORE_PASS" && test -n "$KEY_PASS" || {
            echo "Missing Android signing secrets. See docs/SIGNING.md" >&2
            exit 1
          }

      - name: Fetch upstream Firefox
        id: firefox
        if: steps.decision.outputs.build == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git init upstream
          git -C upstream remote add origin https://github.com/mozilla-firefox/firefox.git
          git -C upstream fetch --depth=1 origin \
            "refs/tags/${{ steps.upstream.outputs.ref }}:refs/tags/${{ steps.upstream.outputs.ref }}"
          git -C upstream checkout --detach "${{ steps.upstream.outputs.ref }}"
          REV="$(git -C upstream rev-parse HEAD)"
          echo "revision=$REV" >> "$GITHUB_OUTPUT"
          echo "FENIX_PRIVACY_UPSTREAM_REVISION=$REV" >> "$GITHUB_ENV"
          echo "FENIX_PRIVACY_UPSTREAM_REF=${{ steps.upstream.outputs.ref }}" >> "$GITHUB_ENV"

      - name: Apply Fenix Privacy patch
        if: steps.decision.outputs.build == 'true'
        run: python3 scripts/apply_fenix_privacy.py upstream

      - name: Remove AVD-only payload from Mozilla bootstrap
        if: steps.decision.outputs.build == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          bootstrap = Path("upstream/python/mozboot/mozboot/linux_common.py")
          text = bootstrap.read_text(encoding="utf-8")

          avd_manifest = "            avd_manifest_path=android.AVD_MANIFEST_X86_64,\n"
          avd_toolchain = "        self.install_toolchain_artifact(android.X86_64_ANDROID_AVD)\n"

          if text.count(avd_manifest) != 1:
              raise SystemExit("Mozilla Android bootstrap AVD manifest anchor changed")
          if text.count(avd_toolchain) != 1:
              raise SystemExit("Mozilla Android bootstrap AVD toolchain anchor changed")

          text = text.replace(avd_manifest, "            avd_manifest_path=None,\n", 1)
          text = text.replace(
              avd_toolchain,
              "        # CI APK build: AVD/system-image toolchain intentionally omitted.\n",
              1,
          )
          bootstrap.write_text(text, encoding="utf-8")
          PY

          grep -n -A8 -B4 'ensure_mobile_android_packages\|avd_manifest_path' \
            upstream/python/mozboot/mozboot/linux_common.py
          echo 'Android SDK packages retained for configure/build:'
          cat upstream/python/mozboot/mozboot/android-packages.txt

      - name: Prepare version
        if: steps.decision.outputs.build == 'true'
        shell: bash
        env:
          RAW: ${{ steps.upstream.outputs.ref }}
        run: |
          set -euo pipefail
          FIREFOX_VERSION="$(python3 - <<'PY'
          import os, re
          s = os.environ["RAW"]
          m = re.fullmatch(r"FIREFOX_(\d+)_(\d+)(?:_(\d+))?_RELEASE", s)
          if not m:
              raise SystemExit("bad Firefox release ref")
          parts = [str(int(m.group(1))), str(int(m.group(2)))]
          if m.group(3) is not None:
              parts.append(str(int(m.group(3))))
          print(".".join(parts))
          PY
          )"
          CODE="$(( $(date -u +%s) - 1735689600 ))"
          NAME="${FIREFOX_VERSION}-privacy.$(date -u +%Y%m%d%H%M%S)"
          echo "FENIX_PRIVACY_VERSION_CODE=$CODE" >> "$GITHUB_ENV"
          echo "FENIX_PRIVACY_VERSION_NAME=$NAME" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=v$NAME" >> "$GITHUB_ENV"

      - name: Free runner disk for Firefox build
        if: steps.decision.outputs.build == 'true'
        shell: bash
        run: |
          set -euo pipefail
          echo 'Disk before cleanup:'
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/share/swift || true
          sudo apt-get clean
          docker system prune -af || true
          echo 'Disk after cleanup:'
          df -h /

      - name: Restore Gradle dependency cache
        if: steps.decision.outputs.build == 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ steps.firefox.outputs.revision }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Bootstrap Firefox Android artifact build
        if: steps.decision.outputs.build == 'true'
        working-directory: upstream
        run: ./mach --no-interactive bootstrap --application-choice="GeckoView/Firefox for Android Artifact Mode"

      - name: Verify AVD system-image was not installed
        if: steps.decision.outputs.build == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if find "$MOZBUILD_STATE_PATH" -maxdepth 3 \( -iname '*android-avd*' -o -iname '*android-device*' \) | grep -q .; then
            echo "Unexpected Android AVD/system-image payload found:" >&2
            find "$MOZBUILD_STATE_PATH" -maxdepth 3 \( -iname '*android-avd*' -o -iname '*android-device*' \) -print >&2
            exit 1
          fi
          test -d "$MOZBUILD_STATE_PATH/android-sdk-linux/emulator" || {
            echo "Android SDK emulator package required by Mozilla configure is missing" >&2
            exit 1
          }
          df -h /

      - name: Initialize Android artifact build context
        if: steps.decision.outputs.build == 'true'
        working-directory: upstream
        env:
          MOZCONFIG: mozconfig
        run: ./mach build

      - name: Build unsigned universal release APK
        if: steps.decision.outputs.build == 'true'
        working-directory: upstream
        env:
          MOZCONFIG: mozconfig
          # Keep enough memory for the Actions agent and OS on the 7.8 GiB
          # hosted runner. Kotlin compiles inside this capped Gradle process,
          # avoiding a second multi-gigabyte daemon.
          GRADLE_FLAGS: >-
            --no-daemon
            --no-parallel
            --max-workers=1
            -Pkotlin.compiler.execution.strategy=in-process
            -Dorg.gradle.vfs.watch=false
            "-Dorg.gradle.jvmargs=-Xmx3g -Xms512m -XX:MaxMetaspaceSize=768m -XX:+HeapDumpOnOutOfMemoryError -XX:+UseParallelGC"
        shell: bash
        run: |
          set -euo pipefail

          free -h
          df -h /

          max_attempts=4
          for ((attempt = 1; attempt <= max_attempts; attempt++)); do
            log="$RUNNER_TEMP/fenix-gradle-attempt-$attempt.log"
            echo "::group::Fenix Gradle build attempt $attempt of $max_attempts"

            set +e
            ./mach gradle fenix:assembleRelease -PdisableDebugSigning 2>&1 | tee "$log"
            status=${PIPESTATUS[0]}
            set -e

            echo "::endgroup::"
            if ((status == 0)); then
              exit 0
            fi

            if ! grep -qi 'maven\.mozilla\.org' "$log" || \
               ! grep -Eqi 'status code 5[0-9]{2}|service unavailable|could not (get|head)|connection (reset|refused)|timed? out|temporary failure|remote host terminated' "$log"; then
              echo "Gradle failed for a non-transient reason; not retrying." >&2
              exit "$status"
            fi

            if ((attempt == max_attempts)); then
              echo "Mozilla Maven remained unavailable after $max_attempts attempts." >&2
              exit "$status"
            fi

            delay=$((30 * (1 << (attempt - 1))))
            echo "Transient Mozilla Maven failure detected; retrying in ${delay}s."
            sleep "$delay"
          done

      - name: Show produced APKs
        if: steps.decision.outputs.build == 'true'
        shell: bash
        run: |
          set -euo pipefail
          find upstream -type f -name '*.apk' -print
          test -n "$(find upstream -type f -name '*.apk' -print -quit)" || {
            echo "No APK was produced by fenix:assembleRelease" >&2
            exit 1
          }

      - name: Upload PR smoke-test APKs
        if: steps.decision.outputs.build == 'true' && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: Fenix-Privacy-Android-PR-smoke-${{ github.event.pull_request.number }}
          retention-days: 7
          if-no-files-found: error
          path: upstream/**/outputs/apk/release/*.apk

      - name: Sign and verify APK
        if: steps.decision.outputs.build == 'true' && github.event_name != 'pull_request'
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          APK="$(find upstream -type f -path '*/fenix/app/outputs/apk/release/*' -name '*universal*.apk' -print -quit)"
          if [[ -z "$APK" ]]; then
            APK="$(find upstream -type f -name '*universal*.apk' -print -quit)"
          fi
          test -n "$APK" || {
            echo "Universal APK not found" >&2
            find upstream -type f -name '*.apk' -print >&2
            exit 1
          }

          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > /tmp/fenix-privacy-release.jks

          SDK_ROOT="$MOZBUILD_STATE_PATH/android-sdk-linux"
          if [[ ! -d "$SDK_ROOT/build-tools" ]]; then
            SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          fi
          test -n "$SDK_ROOT" && test -d "$SDK_ROOT/build-tools" || {
            echo "Android SDK build-tools not found" >&2
            exit 1
          }

          BUILD_TOOLS="$(find "$SDK_ROOT/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n1)"
          "$BUILD_TOOLS/zipalign" -p -f 4 "$APK" /tmp/Fenix-Privacy-aligned.apk
          "$BUILD_TOOLS/apksigner" sign \
            --ks /tmp/fenix-privacy-release.jks \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass "pass:$ANDROID_STORE_PASSWORD" \
            --key-pass "pass:$ANDROID_KEY_PASSWORD" \
            --out Fenix-Privacy-Android.apk \
            /tmp/Fenix-Privacy-aligned.apk

          VERIFY_OUTPUT="$("$BUILD_TOOLS/apksigner" verify --verbose --print-certs Fenix-Privacy-Android.apk)"
          printf '%s\n' "$VERIFY_OUTPUT"

          ACTUAL_CERT="$(
            printf '%s\n' "$VERIFY_OUTPUT" |
            sed -n 's/^Signer #1 certificate SHA-256 digest: //p' |
            head -n1 | tr '[:upper:]' '[:lower:]' | tr -d ':'
          )"
          EXPECTED_CERT="$(tr '[:upper:]' '[:lower:]' < SIGNING_CERT_SHA256 | tr -d '[:space:]:')"

          test -n "$ACTUAL_CERT" && [[ "$ACTUAL_CERT" == "$EXPECTED_CERT" ]] || {
            echo "Signing certificate mismatch" >&2
            exit 1
          }

          rm -f /tmp/fenix-privacy-release.jks /tmp/Fenix-Privacy-aligned.apk

      - name: Create update manifest
        if: steps.decision.outputs.build == 'true' && github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          export FENIX_PRIVACY_APK_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/Fenix-Privacy-Android.apk"
          python3 scripts/make_update_json.py Fenix-Privacy-Android.apk update.json
          cat update.json

      - name: Upload Android build artifact
        if: steps.decision.outputs.build == 'true' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: Fenix-Privacy-Android-${{ env.FENIX_PRIVACY_VERSION_NAME }}
          retention-days: 30
          if-no-files-found: error
          path: |
            Fenix-Privacy-Android.apk
            update.json

      - name: Publish Android GitHub Release
        if: steps.decision.outputs.build == 'true' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" \
            Fenix-Privacy-Android.apk \
            update.json \
            --title "Fenix Privacy Android $FENIX_PRIVACY_VERSION_NAME" \
            --notes "Automatically built from Mozilla Firefox ${FENIX_PRIVACY_UPSTREAM_REF} (${FENIX_PRIVACY_UPSTREAM_REVISION}). Signed APK + update manifest."

      - name: Record successfully released upstream
        if: steps.decision.outputs.build == 'true' && github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' "$FENIX_PRIVACY_UPSTREAM_REF" > UPSTREAM_REF
          printf '%s\n' "$FENIX_PRIVACY_UPSTREAM_REVISION" > UPSTREAM_REVISION
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add UPSTREAM_REF UPSTREAM_REVISION
          git diff --cached --quiet || git commit -m "chore: track $FENIX_PRIVACY_UPSTREAM_REF [skip ci]"
          git push
